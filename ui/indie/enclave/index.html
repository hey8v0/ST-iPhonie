<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#243c49"><title>南极结界 · 鲸湾</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><canvas id="world" tabindex="0" aria-label="南极结界，方向键移动，空格跳跃，J 攻击，K 能力，E 互动"></canvas><div class="vignette" aria-hidden="true"></div>
<header id="hud" hidden><div class="location"><small>ANTARCTIC ENCLAVE</small><b id="place"></b><span id="date"></span></div><nav><span id="money"></span><button data-action="journal" aria-label="旅程记录">◇</button><button data-action="map" aria-label="地图">⌘</button><button data-action="bag" aria-label="背包">▤</button><button data-action="pause" aria-label="暂停">Ⅱ</button></nav></header>
<aside id="vitals" hidden><div><span>生命</span><i><b id="health"></b></i><small id="health-value"></small></div><div><span>气息</span><i><b id="stamina"></b></i><small id="stamina-value"></small></div><section id="skills"></section></aside>
<button id="objective" data-action="journal" hidden></button><div id="notice" role="status" aria-live="polite"></div>
<div id="controls" hidden><div id="stick" aria-label="移动摇杆"><i></i></div><div class="action-buttons"><button data-control="attack" aria-label="近身攻击"><b>斩</b><kbd>J</kbd></button><button data-control="skill" aria-label="使用当前能力"><b id="skill-label">风</b><kbd>K</kbd></button><button data-control="jump" class="jump" aria-label="跳跃"><b>跃</b><kbd>Space</kbd></button></div><button id="interact" data-action="interact" hidden><span></span><kbd>E</kbd></button></div>
<section id="title"><div class="title-copy"><small>ANTARCTIC ENCLAVE</small><h1>南极结界</h1><p>鲸湾 · 海风初至</p><i></i><p class="intro">在世界的尽头，<br>找到属于你的生活。</p><button class="primary" data-action="begin">成为新居民 <span>→</span></button><button class="quiet" data-action="new">新的旅程</button></div><footer><button data-action="exit">← 返回大游戏</button><button data-action="fullscreen">⛶ 全屏</button><span>探索生活 · 原型篇章</span></footer></section>
<section id="overlay" hidden role="dialog" aria-modal="true" aria-label="游戏菜单"><article id="panel"></article></section><section id="orientation" hidden><b>▯ ↻</b><p>横过来，看得更远。</p><button data-action="portrait">继续竖屏</button></section><input id="import-file" type="file" accept="application/json,.json" hidden>
</main><script src="../runtime-capture.js" data-game="南极结界"></script><script type="module" src="main.js"></script></body></html>
