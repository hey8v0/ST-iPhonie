<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>方块世界</title>
<style>
:root{--u:2px;--panel:#c6c6c6;--slot:#8b8b8b;--dark:#373737;--light:#ffffff;--text:#3f3f3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden}
/* forced landscape: a phone held upright gets the game turned on its side */
html.rot #app{width:100vh;width:100dvh;height:100vw;transform:rotate(90deg) translateY(-100%);transform-origin:top left}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
button{font:inherit;color:inherit}
.px{image-rendering:pixelated}
/* ---------- the HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none}
.cross{position:absolute;left:50%;top:50%;width:calc(9*var(--u));height:calc(9*var(--u));transform:translate(-50%,-50%);mix-blend-mode:difference}
.cross::before,.cross::after{content:"";position:absolute;background:#fff}
.cross::before{left:calc(4*var(--u));top:0;width:var(--u);height:100%}
.cross::after{top:calc(4*var(--u));left:0;height:var(--u);width:100%}
.hotbar{position:absolute;left:50%;bottom:calc(2*var(--u) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;padding:var(--u);background:rgba(0,0,0,.45);border:var(--u) solid rgba(30,30,30,.9);box-shadow:inset 0 0 0 var(--u) rgba(120,120,120,.55);pointer-events:auto}
.hotbar .s{width:calc(20*var(--u));height:calc(20*var(--u));position:relative;display:grid;place-items:center;border:var(--u) solid transparent}
.hotbar .s.on{border-color:#fff;box-shadow:0 0 0 var(--u) #000,inset 0 0 0 var(--u) #000}
.hotbar .more{width:calc(14*var(--u));display:grid;place-items:center;font-weight:900;font-size:calc(9*var(--u));color:#ddd}
.icon{width:calc(16*var(--u));height:calc(16*var(--u));image-rendering:pixelated;pointer-events:none}
.n{position:absolute;right:0;bottom:calc(-1*var(--u));font-weight:800;font-size:calc(8*var(--u));line-height:1;color:#fff;text-shadow:var(--u) var(--u) 0 #3f3f3f;pointer-events:none;font-family:ui-monospace,Menlo,Consolas,monospace}
.dur{position:absolute;left:calc(2*var(--u));right:calc(2*var(--u));bottom:calc(1*var(--u));height:calc(2*var(--u));background:#000;pointer-events:none}
.dur i{display:block;height:50%}
.bars{position:absolute;left:50%;bottom:calc(31*var(--u) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(182*var(--u));display:flex;justify-content:space-between;align-items:flex-end}
.armor,.absorb{position:absolute;left:0;bottom:calc(10*var(--u))}
.xp{position:absolute;left:50%;bottom:calc(25*var(--u) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(182*var(--u));height:calc(5*var(--u));background:#1a1a1a;border:calc(.5*var(--u)) solid #000;box-sizing:border-box}
.xp[hidden]{display:none}
.xp i{display:block;height:100%;background:linear-gradient(#b9f55a,#6fd024 60%,#4ea312);width:0}
.xp b{position:absolute;left:50%;bottom:calc(2.5*var(--u));transform:translateX(-50%);font:900 calc(8*var(--u))/1 ui-monospace,Menlo,Consolas,monospace;color:#80ff20;text-shadow:calc(.6*var(--u)) 0 #000,calc(-.6*var(--u)) 0 #000,0 calc(.6*var(--u)) #000,0 calc(-.6*var(--u)) #000}
.row{display:flex;gap:0}
.row img{margin-right:calc(-1*var(--u))}
.row.r{flex-direction:row-reverse}
.row canvas{width:calc(9*var(--u));height:calc(9*var(--u));image-rendering:pixelated}
.air{position:absolute;right:0;bottom:calc(10*var(--u))}
.name{position:absolute;left:50%;bottom:calc(46*var(--u) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:calc(8*var(--u));text-shadow:var(--u) var(--u) 0 #3f3f3f;transition:opacity .5s;white-space:nowrap}
.toast{position:absolute;left:calc(4*var(--u));bottom:calc(60*var(--u));font-size:calc(7*var(--u));display:flex;flex-direction:column;gap:calc(2*var(--u));max-width:60%}
.toast div{background:rgba(0,0,0,.45);padding:calc(1*var(--u)) calc(3*var(--u));transition:opacity .6s}
/* the chat: answers to commands over the game (they fade after a while, all show while typing), the bar to type in */
.chatlog{position:absolute;left:calc(2*var(--u));bottom:calc(76*var(--u));max-width:min(70%,calc(320*var(--u)));display:flex;flex-direction:column;font-size:calc(7*var(--u));pointer-events:none;white-space:pre-wrap}
.chatlog div{background:rgba(0,0,0,.45);padding:calc(.6*var(--u)) calc(2.5*var(--u));transition:opacity 1s}
.chatlog div.bad{color:#ff6b6b}.chatlog div.old{opacity:0}.chatlog.open div.old{opacity:1}
.signedit{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(6*var(--u));background:rgba(0,0,0,.45)}
.signedit .board{width:min(92vw,calc(150*var(--u)));padding:calc(5*var(--u)) calc(4*var(--u));box-sizing:border-box;background:var(--wood,#b8945f);border:calc(2*var(--u)) solid rgba(0,0,0,.35);display:grid;gap:calc(1*var(--u));box-shadow:0 calc(3*var(--u)) 0 rgba(0,0,0,.35)}
.signedit input{width:100%;box-sizing:border-box;background:transparent;border:none;outline:none;text-align:center;font:inherit;font-weight:700;font-size:calc(10*var(--u));color:#1d1d21;padding:calc(1*var(--u)) 0;user-select:text;-webkit-user-select:text;touch-action:auto;caret-color:#000}
.signedit input:focus{background:rgba(255,255,255,.18)}
.signedit button{font:inherit;font-size:calc(9*var(--u));padding:calc(3*var(--u)) calc(14*var(--u));background:#6b6b6b;color:#fff;border:calc(1*var(--u)) solid #222;box-shadow:inset 0 calc(-2*var(--u)) 0 rgba(0,0,0,.35)}
.chatbar{position:absolute;left:calc(2*var(--u));right:calc(2*var(--u));bottom:calc(64*var(--u) + env(safe-area-inset-bottom,0px));z-index:5}
.chatbar input{width:100%;box-sizing:border-box;background:rgba(0,0,0,.6);color:#fff;border:none;outline:none;font:inherit;font-size:calc(8*var(--u));padding:calc(2.5*var(--u)) calc(3*var(--u));user-select:text;-webkit-user-select:text;touch-action:auto}
.debug{position:absolute;left:calc(2*var(--u));top:calc(2*var(--u));font:calc(6.5*var(--u))/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre;text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.25);padding:calc(2*var(--u))}
.hurt{position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(200,0,0,.45));opacity:0;transition:opacity .4s}
.water{position:absolute;inset:0;background:rgba(20,60,160,.25);display:none}
/* the elder guardian's curse: its face looms up and fades */
.curse{position:absolute;left:50%;top:50%;width:62vmin;height:62vmin;transform:translate(-50%,-50%);image-rendering:pixelated;opacity:0;pointer-events:none}
.curse.show{animation:curse 1.8s ease-in-out}
@keyframes curse{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}30%{opacity:.8;transform:translate(-50%,-50%) scale(1)}70%{opacity:.6;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
.sleep{position:absolute;inset:0;background:#05050a;opacity:0;transition:opacity .25s}
.blind{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.55) 0,rgba(0,0,0,.97) 24%);opacity:0;transition:opacity .6s;pointer-events:none}
/* a map held in the hand: the paper at the bottom of the screen */
.mapview{position:absolute;left:50%;bottom:calc(36*var(--u));transform:translateX(-50%);width:min(44vh,58vw);aspect-ratio:1;padding:calc(6*var(--u));box-sizing:border-box;background:#d8c48e;border:calc(1.5*var(--u)) solid #6a4e28;box-shadow:0 0 0 calc(1*var(--u)) #2e2010,0 calc(3*var(--u)) calc(8*var(--u)) rgba(0,0,0,.45);display:none;pointer-events:none}
.mapview canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.portalfx{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(150,60,255,.35),rgba(80,10,170,.85));mix-blend-mode:screen;animation:portalfx 3s linear infinite}
.fireview{position:absolute;left:0;right:0;bottom:0;height:44%;display:none;pointer-events:none;opacity:.92}
.fireview canvas{position:absolute;bottom:-8%;width:52%;height:100%;image-rendering:pixelated}
.fireview canvas:first-child{left:-6%;transform:rotate(-8deg)}.fireview canvas:last-child{right:-6%;transform:scaleX(-1) rotate(-8deg)}
@keyframes portalfx{0%{filter:hue-rotate(0)}50%{filter:hue-rotate(-25deg)}100%{filter:hue-rotate(0)}}
.effects{position:absolute;top:calc(4*var(--u));right:calc(48*var(--u) + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:calc(2*var(--u));pointer-events:none}
.effects .fx{display:flex;align-items:center;gap:calc(3*var(--u));padding:calc(2*var(--u)) calc(4*var(--u));background:rgba(0,0,0,.45);color:#fff;font-size:calc(7*var(--u));text-shadow:var(--u) var(--u) 0 #3a3a3a;white-space:nowrap}
.effects .fx.bad{color:#ffb0a8}
.effects .fx i{width:calc(6*var(--u));height:calc(6*var(--u));border-radius:50%;box-shadow:inset calc(-1*var(--u)) calc(-1*var(--u)) 0 rgba(0,0,0,.35)}
.effects .fx b{font-weight:normal;color:#ddd;margin-left:calc(2*var(--u))}
.pausebtn{position:absolute;right:calc(4*var(--u) + env(safe-area-inset-right,0px));top:calc(4*var(--u));width:calc(16*var(--u));height:calc(16*var(--u));pointer-events:auto;background:rgba(0,0,0,.4);border:var(--u) solid rgba(255,255,255,.35);display:none}
.pausebtn::before,.pausebtn::after{content:"";position:absolute;top:25%;bottom:25%;width:18%;background:#fff}
.pausebtn::before{left:27%}.pausebtn::after{right:27%}
.touchmode .pausebtn{display:block}
/* ---------- touch controls ---------- */
.touch{position:absolute;inset:0;pointer-events:none;display:none}
.touchmode .touch{display:block}
.touch .tb{position:absolute;pointer-events:auto;width:calc(26*var(--u));height:calc(26*var(--u));border:var(--u) solid rgba(255,255,255,.45);background:rgba(0,0,0,.28);display:grid;place-items:center;padding:0}
.touch .tb[hidden]{display:none}
.touch .tb svg{width:60%;height:60%;fill:rgba(255,255,255,.85)}
.touch .tb.on,.touch .tb.lit{background:rgba(255,255,255,.35)}
.touch .jump{right:calc(14*var(--u) + env(safe-area-inset-right,0px));bottom:calc(34*var(--u))}
.touch .sneak{right:calc(44*var(--u) + env(safe-area-inset-right,0px));bottom:calc(18*var(--u))}
.touch .up{right:calc(14*var(--u) + env(safe-area-inset-right,0px));bottom:calc(64*var(--u))}
.touch .down{right:calc(14*var(--u) + env(safe-area-inset-right,0px));bottom:calc(4*var(--u))}
.touch .view{right:calc(24*var(--u) + env(safe-area-inset-right,0px));top:calc(4*var(--u));width:calc(16*var(--u));height:calc(16*var(--u))}
.touch .chat{right:calc(44*var(--u) + env(safe-area-inset-right,0px));top:calc(4*var(--u));width:calc(16*var(--u));height:calc(16*var(--u))}
.touch .stick{position:absolute;width:calc(48*var(--u));height:calc(48*var(--u));margin:calc(-24*var(--u)) 0 0 calc(-24*var(--u));border-radius:50%;border:var(--u) solid rgba(255,255,255,.4);background:rgba(0,0,0,.18)}
.touch .stick i{position:absolute;left:50%;top:50%;width:calc(20*var(--u));height:calc(20*var(--u));margin:calc(-10*var(--u)) 0 0 calc(-10*var(--u));border-radius:50%;background:rgba(255,255,255,.55)}
/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(4*var(--u));padding:calc(8*var(--u));overflow:auto}
.screen[hidden]{display:none}
.screen.dirt{background-color:#1f1810;background-size:calc(32*var(--u));image-rendering:pixelated}
.screen.dim{background:rgba(16,16,16,.6)}
.title{font-size:calc(26*var(--u));font-weight:900;letter-spacing:.06em;color:#e8e8e8;text-shadow:calc(2*var(--u)) calc(2*var(--u)) 0 #3a3a3a,calc(-1*var(--u)) calc(-1*var(--u)) 0 #8a8a8a;margin-bottom:calc(10*var(--u))}
.sub{font-size:calc(7*var(--u));color:#ffff55;text-shadow:var(--u) var(--u) 0 #3f3f15;transform:rotate(-8deg);margin:calc(-16*var(--u)) 0 calc(8*var(--u)) calc(110*var(--u))}
h2{margin:0 0 calc(4*var(--u));font-size:calc(10*var(--u));text-shadow:var(--u) var(--u) 0 #3f3f3f;font-weight:700}
.btn{min-width:calc(150*var(--u));height:calc(20*var(--u));font-size:calc(8*var(--u));background:#6f6f6f linear-gradient(#8a8a8a,#6a6a6a);border:var(--u) solid #000;box-shadow:inset var(--u) var(--u) 0 #aaa,inset calc(-1*var(--u)) calc(-2*var(--u)) 0 #555;color:#e0e0e0;text-shadow:var(--u) var(--u) 0 #3f3f3f;cursor:pointer;padding:0 calc(6*var(--u))}
.btn:hover,.btn:focus-visible,.btn.focus{background:#7a8cc8 linear-gradient(#8fa0dc,#6f80bc);color:#ffffa0;outline:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.half{min-width:calc(73*var(--u))}
.btn.third{min-width:calc(48*var(--u))}
.btns{display:flex;gap:calc(4*var(--u));flex-wrap:wrap;justify-content:center}
.list{width:min(92%,calc(260*var(--u)));max-height:55%;overflow:auto;background:rgba(0,0,0,.5);border:var(--u) solid #000;display:flex;flex-direction:column}
.list .it{display:flex;gap:calc(6*var(--u));align-items:center;padding:calc(4*var(--u)) calc(6*var(--u));cursor:pointer;border:var(--u) solid transparent}
.list .it.on{border-color:#fff;background:rgba(255,255,255,.08)}
.list .it b{font-size:calc(8*var(--u))}
.list .it small{display:block;font-size:calc(6.5*var(--u));color:#aaa}
.form{display:flex;flex-direction:column;gap:calc(4*var(--u));width:min(92%,calc(220*var(--u)))}
.form label{font-size:calc(7*var(--u));color:#ccc;display:flex;flex-direction:column;gap:var(--u)}
.form input[type=text]{height:calc(18*var(--u));font-size:calc(8*var(--u));background:#000;color:#fff;border:var(--u) solid #a0a0a0;padding:0 calc(4*var(--u))}
.seg{display:flex;gap:calc(3*var(--u))}
.seg .btn{min-width:0;flex:1}
.seg .btn.sel{background:#4a6a3a linear-gradient(#5f8a4a,#466a36);color:#fff}
.slider{display:flex;flex-direction:column;gap:var(--u);width:100%}
.slider span{font-size:calc(7.5*var(--u));text-shadow:var(--u) var(--u) 0 #3f3f3f}
.slider input{width:100%;accent-color:#8fa0dc;height:calc(10*var(--u))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:calc(4*var(--u)) calc(8*var(--u));width:min(94%,calc(320*var(--u)))}
.grid2>*{min-width:0}.grid2 .btn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:calc(6.5*var(--u));color:#bbb;max-width:min(94%,calc(300*var(--u)));line-height:1.5;text-align:center}
.bar{width:min(80%,calc(200*var(--u)));height:calc(3*var(--u));background:#333;border:var(--u) solid #000}
.bar i{display:block;height:100%;background:#80ff20;width:0}
.dead{background:rgba(120,0,0,.45)}
.dead .title{color:#fff;font-size:calc(20*var(--u))}
/* ---------- inventories ---------- */
.inv{position:absolute;inset:0;background:rgba(16,16,16,.55);display:flex;align-items:center;justify-content:center}
/* fingers in the windows are the game's (its own scrolling of the lists, carrying stacks): the page must not pan */
.inv,.inv *{touch-action:none}
.inv[hidden]{display:none}
.win{background:var(--panel);border:var(--u) solid #000;box-shadow:inset calc(2*var(--u)) calc(2*var(--u)) 0 var(--light),inset calc(-2*var(--u)) calc(-2*var(--u)) 0 #555;padding:calc(7*var(--u));color:var(--text);position:relative;max-height:96%;display:flex;flex-direction:column;gap:calc(3*var(--u))}
.win h3{margin:0;font-size:calc(7.5*var(--u));font-weight:600;color:var(--text)}
.slots{display:grid;grid-template-columns:repeat(9,calc(18*var(--u)))}
.slot{width:calc(18*var(--u));height:calc(18*var(--u));background:var(--slot);border:var(--u) solid;border-color:var(--dark) var(--light) var(--light) var(--dark);position:relative;display:grid;place-items:center;cursor:pointer}
.slot:hover,.slot.focus{background:#a8a8a8}
.slot.big{width:calc(26*var(--u));height:calc(26*var(--u))}
.slot .n{color:#fff}
.craft{display:flex;align-items:center;gap:calc(8*var(--u))}
.craft .g2{display:grid;grid-template-columns:repeat(2,calc(18*var(--u)))}
.craft .g3{display:grid;grid-template-columns:repeat(3,calc(18*var(--u)))}
.worn{display:grid;grid-template-columns:calc(18*var(--u))}
.icon.ghost{opacity:.25;filter:grayscale(1) brightness(.35)}
.arrow{width:calc(22*var(--u));height:calc(15*var(--u));position:relative}
.arrow::before{content:"";position:absolute;left:0;top:35%;width:65%;height:30%;background:#8b8b8b}
.arrow::after{content:"";position:absolute;right:0;top:0;border-left:calc(9*var(--u)) solid #8b8b8b;border-top:calc(7.5*var(--u)) solid transparent;border-bottom:calc(7.5*var(--u)) solid transparent}
.arrow i{position:absolute;left:0;top:35%;height:30%;background:#fff;width:0;z-index:1}
.fire{width:calc(14*var(--u));height:calc(14*var(--u));position:relative;background:linear-gradient(#8b8b8b,#8b8b8b);clip-path:polygon(50% 0,80% 35%,100% 70%,80% 100%,20% 100%,0 70%,20% 35%)}
.fire i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffe066,#ff7a1a)}
.furnace{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto auto;align-items:center;justify-items:center;gap:calc(2*var(--u)) calc(10*var(--u));padding:calc(4*var(--u)) calc(30*var(--u))}
.cursor{position:absolute;pointer-events:none;width:calc(16*var(--u));height:calc(16*var(--u));transform:translate(-50%,-50%);z-index:5}
.tabs{display:flex;gap:var(--u);flex-wrap:wrap;padding-right:calc(16*var(--u))}
.tabs button{font-size:calc(6.5*var(--u));padding:var(--u) calc(4*var(--u));background:#9b9b9b;border:var(--u) solid #000;color:#333;cursor:pointer}
.tabs button.on{background:var(--panel);font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(9,calc(18*var(--u)));max-height:calc(18*5*var(--u));overflow-y:auto;overflow-x:hidden}
.search{height:calc(12*var(--u));font-size:calc(7*var(--u));width:calc(80*var(--u));background:#000;color:#fff;border:var(--u) solid #a0a0a0;padding:0 var(--u)}
.tip{position:absolute;pointer-events:none;background:#100010f0;border:var(--u) solid #2a0a5a;color:#fff;font-size:calc(7*var(--u));padding:calc(2*var(--u)) calc(4*var(--u));z-index:6;white-space:pre;line-height:1.45}
/* enchanted: a purple shimmer passing over the item's own shape */
.glint{position:absolute;left:50%;top:50%;width:calc(16*var(--u));height:calc(16*var(--u));transform:translate(-50%,-50%);pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(115deg,transparent 35%,rgba(170,90,255,.7) 45%,rgba(235,200,255,.8) 50%,rgba(170,90,255,.7) 55%,transparent 65%);background-size:300% 100%;animation:glint 2.6s linear infinite;mix-blend-mode:screen}
@keyframes glint{from{background-position:100% 0}to{background-position:-200% 0}}
.enchant{display:flex;gap:calc(8*var(--u));align-items:center}
.ench-in{display:flex;gap:calc(3*var(--u))}
.slot.lapis::after{content:"";position:absolute;inset:25%;background:#2350b8;opacity:.25;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.ench-opts{display:flex;flex-direction:column;gap:var(--u)}
.slot.opt{width:calc(108*var(--u));height:calc(19*var(--u));display:grid;grid-template-columns:calc(16*var(--u)) 1fr;grid-template-rows:1fr 1fr;align-items:center;padding:0 calc(3*var(--u));background:#b9a7d6;text-align:left}
.slot.opt b{grid-row:1/3;color:#80ff20;text-shadow:calc(.6*var(--u)) calc(.6*var(--u)) 0 #000;font:900 calc(9*var(--u))/1 ui-monospace,Menlo,Consolas,monospace}
.slot.opt span{font-size:calc(6.5*var(--u));color:#3a1a5a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.opt small{font-size:calc(5.5*var(--u));color:#4a3a6a}
.slot.opt.off{background:#8c8496;cursor:default}.slot.opt.off b{color:#3f7f10}
.slot.opt:not(.off):hover{background:#d0bff0}
.anvil{display:flex;align-items:center;gap:calc(4*var(--u));justify-content:center}
.anvil .plus{font-size:calc(10*var(--u));color:#555}
.cost{margin:0;text-align:center;font-size:calc(7*var(--u));color:#3c8a12;font-weight:700}
.win .note{color:#555;margin:0 auto}
.cost.bad{color:#c0292b}
/* trading: the villager's offers down the left (sold out ones crossed through), the payment and what it gives on the right */
.vxp{height:calc(3*var(--u));background:#3a3a3a;margin:0 calc(30*var(--u)) calc(3*var(--u))}
.vxp i{display:block;height:100%;background:#7ec82a}
.trade{display:flex;gap:calc(8*var(--u));align-items:flex-start}
.offers{display:flex;flex-direction:column;gap:var(--u);max-height:calc(19*5*var(--u));overflow-y:auto;overflow-x:hidden}
.slot.offer{width:calc(70*var(--u));height:calc(18*var(--u));display:flex;align-items:center;gap:var(--u);padding:0 calc(2*var(--u));background:#a8a8a8}
.slot.offer.on{background:#d8d8d8;outline:var(--u) solid #fff}
.slot.offer.off{opacity:.55;background-image:linear-gradient(160deg,transparent 46%,#c0292b 47% 53%,transparent 54%)}
.slot.offer b{color:#555;font-size:calc(8*var(--u));margin:0 var(--u)}
.mini{position:relative;width:calc(16*var(--u));height:calc(16*var(--u));display:inline-block}
.mini .icon{width:100%;height:100%}
.mini .n{font-size:calc(6*var(--u))}
.tpay{display:flex;align-items:center;gap:calc(3*var(--u));margin-top:calc(14*var(--u))}
/* the brewing stand: fuel at the left, the ingredient over the bottles, bubbles rising while it brews */
.brew{display:grid;grid-template-columns:auto auto;gap:calc(2*var(--u)) calc(16*var(--u));justify-content:center;align-items:start;padding:calc(2*var(--u)) 0}
.bfuel{display:flex;flex-direction:column;align-items:center;gap:calc(2*var(--u));grid-row:1/3}
.fuelbar{width:calc(18*var(--u));height:calc(4*var(--u));background:#3a3a3a}
.fuelbar i{display:block;height:100%;background:linear-gradient(#ffd24a,#e8701a)}
.slot.powder::after{content:"";position:absolute;inset:30%;background:#e8a020;opacity:.3;border-radius:50%}
.bmid{display:flex;align-items:center;gap:calc(3*var(--u))}
.bubbles{width:calc(8*var(--u));height:calc(18*var(--u));background:repeating-radial-gradient(circle at 50% 100%,rgba(255,255,255,.65) 0 calc(1.2*var(--u)),transparent calc(1.4*var(--u)) calc(3*var(--u)));opacity:.15}
.bubbles.on{opacity:.9;animation:bub 1.2s linear infinite}
@keyframes bub{from{background-position:0 0}to{background-position:0 calc(-12*var(--u))}}
.barrow{width:calc(6*var(--u));height:calc(22*var(--u));background:#8b8b8b;position:relative;clip-path:polygon(25% 0,75% 0,75% 70%,100% 70%,50% 100%,0 70%,25% 70%)}
.barrow i{position:absolute;left:0;right:0;top:0;background:#fff}
.bottles{display:flex;gap:calc(4*var(--u));grid-column:2}
.bottles .slot:nth-child(2){margin-top:calc(6*var(--u))}
.slot.bottle::after{content:"";position:absolute;inset:22% 32% 18%;border:var(--u) solid rgba(80,90,110,.35);border-radius:40% 40% 45% 45%;opacity:.8}
.trash{background:#a33}
.close{position:absolute;right:calc(3*var(--u));top:calc(3*var(--u));width:calc(12*var(--u));height:calc(12*var(--u));background:#8b8b8b;border:var(--u) solid #000;color:#fff;font-size:calc(8*var(--u));line-height:1;padding:0;cursor:pointer}
.err{position:absolute;left:8px;right:8px;bottom:8px;background:#600;color:#fff;font:12px/1.4 monospace;padding:6px;white-space:pre-wrap;z-index:99;pointer-events:auto}
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="hud" hidden>
    <div class="water"></div>
    <div class="hurt"></div>
    <div class="sleep"></div>
    <div class="portalfx"></div>
    <div class="fireview"><canvas width="16" height="16"></canvas><canvas width="16" height="16"></canvas></div>
    <div class="blind"></div>
    <canvas class="curse" width="12" height="12"></canvas>
    <div class="cross"></div>
    <div class="effects"></div>
    <div class="debug" hidden></div>
    <div class="toast"></div>
    <div class="chatlog"></div>
    <div class="name"></div>
    <div class="bars"><div class="row hearts"></div><div class="row r food"></div><div class="row r air"></div><div class="row armor"></div><div class="row absorb"></div></div>
    <div class="xp"><i></i><b></b></div>
    <div class="mapview"><canvas width="128" height="128"></canvas></div>
    <div class="hotbar"></div>
    <button class="pausebtn" aria-label="暂停"></button>
  </div>
  <div id="screens"></div>
  <div id="inv" class="inv" hidden></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
